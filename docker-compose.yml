version: '3.8'

services:
  # ==========================================================
  # BROKER RABBITMQ (Mensajería Asíncrona Cloud Native)
  # Consola web: http://localhost:15672 (user: guest / pass: guest)
  # Puerto AMQP: 5672
  # ==========================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-pedidos360
    restart: unless-stopped
    ports:
      - "5672:5672"    # Protocolo AMQP para los microservicios
      - "15672:15672"  # Consola Web de Administración RabbitMQ
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ==========================================================
  # MICROSERVICIO ADMINISTRADOR (Gestión de Colas y Recursos)
  # Puerto: 8084
  # ==========================================================
  ms-administrador:
    build:
      context: ./Administrador/Administrador
      dockerfile: Dockerfile
    container_name: ms-administrador
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ==========================================================
  # MICROSERVICIO ÓRDENES (Pedidos y Consumidor de Cocina)
  # Puerto: 8083
  # ==========================================================
  ms-pedidos360-orders:
    build:
      context: ./ms-pedidos360-orders/ms-pedidos360-orders
      dockerfile: Dockerfile
    container_name: ms-pedidos360-orders
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ==========================================================
  # MICROSERVICIO CATÁLOGO (Productos del Restaurante)
  # Puerto: 8081
  # ==========================================================
  ms-catalogo:
    build:
      context: ./ms-catalogo/ms-catalogo
      dockerfile: Dockerfile
    container_name: ms-catalogo
    restart: unless-stopped
    ports:
      - "8081:8081"

  # ==========================================================
  # BACKEND FOR FRONTEND (BFF - Gateway & Seguridad Azure AD)
  # Puerto: 8080
  # ==========================================================
  ms-pedidos360-bff:
    build:
      context: ./ms-pedidos360-bff/ms-pedidos360-bff
      dockerfile: Dockerfile
    container_name: ms-pedidos360-bff
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - ms-catalogo
      - ms-pedidos360-orders

  # ==========================================================
  # FRONTEND (Angular 22)
  # Puerto: 4200
  # ==========================================================
  frontend-pedidos360:
    build:
      context: ./Proyecto-Angular-Cloude-Native
      dockerfile: Dockerfile
    container_name: frontend-pedidos360
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - ms-pedidos360-bff

volumes:
  rabbitmq_data:
    driver: local
